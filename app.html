<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레시피 보드 | AI Recipe Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* 기본 라이트 모드 테마 변수 선언 */
        :root {
            --bg-color: #fafaf9;
            --card-bg: #ffffff;
            --text-color: #292524;
            --text-muted: #78716c;
            --border-color: #e7e5e4;
            --panel-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        /* 🌙 다크 모드 테마 변수 선언 */
        body.dark-theme {
            --bg-color: #1c1917;
            --card-bg: #262220;
            --text-color: #f5f5f4;
            --text-muted: #a8a29e;
            --border-color: #44403c;
            --panel-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .app-layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            margin-top: 20px;
        }
        .fridge-sidebar {
            width: 320px;
            flex-shrink: 0;
            position: sticky;
            top: 20px; 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .recipe-content {
            flex: 1;
        }
        .fridge-panel { 
            background: var(--card-bg); 
            border-radius: 16px; 
            padding: 24px; 
            border: 1px solid var(--border-color); 
            box-shadow: var(--panel-shadow);
            transition: background-color 0.3s, border-color 0.3s;
        }
        .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .input-group input { 
            flex: 1; padding: 12px; border: 1px solid var(--border-color); 
            border-radius: 8px; outline: none; font-family: 'Pretendard';
            background: var(--card-bg); color: var(--text-color);
        }
        .input-group button { 
            background: #ea580c; color: white; border: none; border-radius: 8px; 
            padding: 0 16px; cursor: pointer; font-weight: bold; white-space: nowrap; 
        }
        .input-group button:hover { background: #c2410c; }
        
        /* 💡 원클릭 추천 태그 스타일 */
        .quick-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
        }
        .quick-tag-btn {
            background: #f5f5f4;
            color: #44403c;
            border: 1px solid #e7e5e4;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Pretendard';
        }
        .quick-tag-btn:hover {
            background: #ffedd5;
            color: #ea580c;
            border-color: #fed7aa;
        }
        body.dark-theme .quick-tag-btn {
            background: #2b2624;
            color: #cbd5e1;
            border-color: #44403c;
        }
        body.dark-theme .quick-tag-btn:hover {
            background: #431407;
            color: #ffaca3;
            border-color: #7c2d12;
        }

        .ingredient-tag { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #fff7ed; border: 1px solid #ffedd5; color: #ea580c; 
            padding: 12px 16px; border-radius: 8px; margin-bottom: 10px; font-size: 0.95rem; font-weight: 600; 
        }
        body.dark-theme .ingredient-tag {
            background: #431407; border-color: #7c2d12; color: #ffaca3;
        }

        .user-auth-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-name-tag {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-color);
        }
        .btn-logout {
            background: #78716c; color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; border: none; transition: 0.2s;
        }
        .btn-logout:hover { background: #444; }

        .btn-theme-toggle {
            background: none; border: none; color: var(--text-color); font-size: 1.2rem; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background 0.2s;
        }
        .btn-theme-toggle:hover { background: rgba(120, 113, 108, 0.2); }

        /* 🌓 다크모드 전용 요소별 세부 보정 스타일 */
        body.dark-theme .recipe-card { background: var(--card-bg); border-color: var(--border-color); color: var(--text-color); }
        body.dark-theme .filter-box { background: var(--card-bg); border-color: var(--border-color); color: var(--text-color); }
        body.dark-theme .filter-label { color: var(--text-color); }
        body.dark-theme .modal-content { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); }
        body.dark-theme .app-header { background: #262220; }
        body.dark-theme .app-header h1 { color: #ffffff !important; }
        body.dark-theme .app-header .subtitle { color: #cbd5e1 !important; }
        body.dark-theme .results-title { color: var(--text-color); }
        
        /* 🚨 [수정 완료] 다크모드 시 레시피 카드의 타이틀과 텍스트가 안 보이던 현상 강제 보정 */
        body.dark-theme .recipe-card h3 { color: #ffffff !important; }
        body.dark-theme .recipe-card .recipe-desc { color: #cbd5e1 !important; }
        body.dark-theme .recipe-card .card-footer { color: #a8a29e !important; }
        body.dark-theme .recipe-card .card-footer span { color: #a8a29e !important; }
        
        body.dark-theme .filter-btn:not(.active) {
            background: #2b2624; color: #cbd5e1; border-color: #44403c;
        }

        @media (max-width: 992px) {
            .app-layout { flex-direction: column; }
            .fridge-sidebar { width: 100%; position: static; }
        }
    </style>
</head>
<body id="app-page">
    
    <nav class="navbar app-navbar" style="background: var(--card-bg); border-bottom: 1px solid var(--border-color); transition: background 0.3s, border-color 0.3s;">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="index.html" class="logo" style="color: var(--text-color);">
                <i class="fas fa-utensils" style="color: #ea580c;"></i> AI Recipe Master
            </a>
            <div class="user-auth-info">
                <button onclick="toggleTheme()" class="btn-theme-toggle" id="themeToggleBtn" title="화면 테마 변경">
                    <i class="fas fa-moon"></i>
                </button>
                <span id="userDisplayName" class="user-name-tag">불러오는 중...</span>
                <button onclick="doLogout()" class="btn-logout">로그아웃</button>
            </div>
        </div>
    </nav>

    <header class="app-header">
        <div class="container header-inner">
            <h1><i class="fas fa-search"></i> 레시피 검색</h1>
            <p class="subtitle">집에 있는 재료나 먹고 싶은 음식의 느낌을 적어주세요.</p>
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="예: 참치캔, 남은 채소, 매콤한 국물 요리">
                <button class="btn-search">검색하기</button>
            </div>
        </div>
    </header>

    <section class="container filter-section">
        <div class="filter-box">
            <div class="filter-row">
                <div class="filter-label">누구를 위한 요리인가요?</div>
                <div class="filter-buttons" id="targetFilter">
                    <button class="filter-btn active" data-target="전체">상관없음</button>
                    <button class="filter-btn" data-target="1인 가구">자취생 (1인 가구)</button>
                    <button class="filter-btn" data-target="아이 가정">아이 반찬</button>
                    <button class="filter-btn" data-target="부모님">부모님 건강식</button>
                </div>
            </div>
            <div class="divider"></div>
            <div class="filter-row">
                <div class="filter-label">어떤 종류가 끌리시나요?</div>
                <div class="filter-buttons" id="categoryFilter">
                    <button class="filter-btn active" data-category="전체">전체 요리</button>
                    <button class="filter-btn" data-category="한식">정갈한 한식</button>
                    <button class="filter-btn" data-category="일식">깔끔한 일식</button>
                    <button class="filter-btn" data-category="중식">든든한 중식</button>
                    <button class="filter-btn" data-category="양식">분위기 양식</button>
                    <button class="filter-btn" data-category="야외/캠핑">야외/캠핑</button>
                </div>
            </div>
        </div>
    </section>

    <main class="container">
        <div class="app-layout">
            
            <aside class="fridge-sidebar">
                <div class="fridge-panel">
                    <h3 style="margin-top: 0; margin-bottom: 8px; font-size: 1.2rem;">
                        <i class="fas fa-snowflake" style="color: #60a5fa;"></i> 내 냉장고 재료
                    </h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">재료를 입력하거나 아래 추천 태그를 클릭해 보세요.</p>
                    
                    <div class="input-group">
                        <input type="text" id="ingInput" placeholder="예: 다진 마늘, 냉동 삼겹살" onkeypress="if(event.keyCode==13) addIngredient()">
                        <button onclick="addIngredient()">추가</button>
                    </div>

                    <div class="quick-tags-container">
                        <button class="quick-tag-btn" onclick="addQuickIngredient('달걀')">+ 달걀</button>
                        <button class="quick-tag-btn" onclick="addQuickIngredient('양파')">+ 양파</button>
                        <button class="quick-tag-btn" onclick="addQuickIngredient('대파')">+ 대파</button>
                        <button class="quick-tag-btn" onclick="addQuickIngredient('두부')">+ 두부</button>
                        <button class="quick-tag-btn" onclick="addQuickIngredient('김치')">+ 김치</button>
                        <button class="quick-tag-btn" onclick="addQuickIngredient('돼지고기')">+ 돼지고기</button>
                        <button class="quick-tag-btn" onclick="addQuickIngredient('다진 마늘')">+ 마늘</button>
                        <button class="quick-tag-btn" onclick="addQuickIngredient('스팸')">+ 스팸</button>
                    </div>

                    <div id="myFridgeList"></div>

                    <button id="btnAiRecommend" onclick="askAiChef()" style="width: 100%; margin-top: 10px; padding: 14px; background: linear-gradient(135deg, #ef4444 0%, #ea580c 100%); color: white; border: none; border-radius: 8px; font-weight: 800; font-family: 'Pretendard'; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(234, 88, 12, 0.3); transition: 0.2s;">
                        <i class="fas fa-robot"></i> AI 셰프에게 추천받기
                    </button>
                </div>

                <div class="fridge-panel">
                    <h3 style="margin-top: 0; margin-bottom: 12px; font-size: 1.1rem; font-weight: 700;">
                        <i class="fas fa-bookmark" style="color: #ea580c;"></i> 내가 저장한 AI 레시피
                    </h3>
                    <div id="myFavoriteList" style="display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; padding-right: 4px;"></div>
                </div>
            </aside>

            <div class="recipe-content">
                <div class="results-header" style="margin-top: 0;">
                    <h2 class="results-title">추천 레시피 <span id="resultCount" class="count-number">0</span></h2>
                </div>
                <div class="recipe-grid" id="recipeGrid"></div>
            </div>

        </div>
    </main>

    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
