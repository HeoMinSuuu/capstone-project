<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레시피 보드 | AI Recipe Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body id="app-page">
    
    <nav class="navbar app-navbar">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="index.html" class="logo">
                <i class="fas fa-utensils"></i> AI Recipe Master
            </a>
            <div class="user-auth-info" style="display: flex; align-items: center; gap: 15px;">
                <button onclick="toggleTheme()" class="btn-theme-toggle" id="themeToggleBtn" title="화면 테마 변경">
                    <i class="fas fa-moon"></i>
                </button>
                <span id="userDisplayName" class="user-name-tag">불러오는 중...</span>
                <button onclick="doLogout()" class="btn-logout">로그아웃</button>
            </div>
        </div>
    </nav>

    <header class="app-header">
        <div class="container header-inner" style="max-width: 100%;">
            <h1><i class="fas fa-search" style="color: #ea580c;"></i> 레시피 검색</h1>
            <p class="subtitle">집에 있는 재료나 먹고 싶은 음식의 느낌을 적어주세요.</p>
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="예: 참치캔, 남은 채소, 매콤한 국물 요리">
                <button class="btn-search">검색하기</button>
            </div>
        </div>
    </header>

    <!-- 상세 다중 필터 섹션 -->
    <section class="container filter-section">
        <div class="filter-box">
            <div class="filter-row">
                <div class="filter-label">누구를 위한 요리인가요?</div>
                <div class="filter-buttons" id="targetFilter">
                    <button class="filter-btn active" data-target="전체">상관없음</button>
                    <button class="filter-btn" data-target="1인 가구">자취생 (1인 가구)</button>
                    <button class="filter-btn" data-target="아이 가정">아이 반찬</button>
                    <button class="filter-btn" data-target="부모님">부모님 건강식</button>
                </div>
            </div>
            <div class="divider"></div>
            <div class="filter-row">
                <div class="filter-label">어떤 종류가 끌리시나요?</div>
                <div class="filter-buttons" id="categoryFilter">
                    <button class="filter-btn active" data-category="전체">전체 요리</button>
                    <button class="filter-btn" data-category="한식">정갈한 한식</button>
                    <button class="filter-btn" data-category="일식">깔끔한 일식</button>
                    <button class="filter-btn" data-category="중식">든든한 중식</button>
                    <button class="filter-btn" data-category="양식">분위기 양식</button>
                    <button class="filter-btn" data-category="야외/캠핑">야외/캠핑</button>
                </div>
            </div>
            <div class="divider"></div>
            <div class="filter-row">
                <div class="filter-label">조리 난이도는 어떤가요?</div>
                <div class="filter-buttons" id="difficultyFilter">
                    <button class="filter-btn active" data-difficulty="전체">전체 난이도</button>
                    <button class="filter-btn" data-difficulty="1">🔥 쉬움 (★1)</button>
                    <button class="filter-btn" data-difficulty="2">🔥🔥 보통 (★2)</button>
                    <button class="filter-btn" data-difficulty="3">🔥🔥🔥 정성 요리 (★3)</button>
                </div>
            </div>
            <div class="divider"></div>
            <div class="filter-row">
                <div class="filter-label">조리 소요 시간</div>
                <div class="filter-buttons" id="timeFilter">
                    <button class="filter-btn active" data-time="전체">전체 시간</button>
                    <button class="filter-btn" data-time="15">⚡ 15분 이내 (초간단)</button>
                    <button class="filter-btn" data-time="30">⏱️ 30분 이내</button>
                </div>
            </div>
        </div>
    </section>

    <main class="container">
        <!-- 메인 탭 -->
        <div class="main-nav-tabs">
            <button class="main-tab-btn active" onclick="switchMainTab('recipe')" id="tabBtnRecipe">
                🤖 AI 추천 레시피
            </button>
            <button class="main-tab-btn" onclick="switchMainTab('community')" id="tabBtnCommunity">
                👥 유저 커뮤니티
            </button>
        </div>

        <div class="app-layout">
            
            <!-- 왼쪽 사이드바 -->
            <aside class="fridge-sidebar">
                <!-- 내 냉장고 재료 -->
                <div class="fridge-panel">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <h3 style="margin: 0; font-size: 1.2rem;">
                            <i class="fas fa-snowflake" style="color: #60a5fa;"></i> 내 냉장고 재료
                            <span id="fridgeCount" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">(0)</span>
                        </h3>
                        <button onclick="clearAllIngredients()" class="btn-text-clear">전체 비우기</button>
                    </div>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">재료를 입력하거나 아래 추천 칩을 클릭해 보세요.</p>
                    
                    <div class="input-group">
                        <input type="text" id="ingInput" placeholder="예: 다진 마늘, 냉동 삼겹살" onkeypress="if(event.keyCode==13) addIngredient()">
                        <button onclick="addIngredient()">추가</button>
                    </div>

                    <div class="quick-tags-container">
                        <button type="button" class="quick-chip" onclick="addQuickIngredient('달걀')">+ 달걀</button>
                        <button type="button" class="quick-chip" onclick="addQuickIngredient('양파')">+ 양파</button>
                        <button type="button" class="quick-chip" onclick="addQuickIngredient('대파')">+ 대파</button>
                        <button type="button" class="quick-chip" onclick="addQuickIngredient('두부')">+ 두부</button>
                        <button type="button" class="quick-chip" onclick="addQuickIngredient('김치')">+ 김치</button>
                        <button type="button" class="quick-chip" onclick="addQuickIngredient('돼지고기')">+ 돼지고기</button>
                        <button type="button" class="quick-chip" onclick="addQuickIngredient('다진 마늘')">+ 마늘</button>
                        <button type="button" class="quick-chip" onclick="addQuickIngredient('스팸')">+ 스팸</button>
                    </div>

                    <div id="myFridgeList" style="max-height: 180px; overflow-y: auto; margin-bottom: 12px;"></div>

                    <button id="btnAiRecommend" onclick="askAiChef()" class="btn-ai-recommend">
                        <i class="fas fa-robot"></i> AI 셰프에게 추천받기
                    </button>
                </div>

                <!-- 장보기 메모장 -->
                <div class="fridge-panel">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h3 style="margin: 0; font-size: 1.1rem; font-weight: 700;">
                            <i class="fas fa-shopping-cart" style="color: #22c55e;"></i> 장보기 메모장
                            <span id="shopCount" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">(0)</span>
                        </h3>
                        <button onclick="clearShoppingList()" class="btn-text-clear">전체 비우기</button>
                    </div>
                    <div class="input-group" style="margin-bottom: 10px;">
                        <input type="text" id="shopInput" placeholder="부족한 재료 메모..." onkeypress="if(event.keyCode==13) addShoppingItem()">
                        <button onclick="addShoppingItem()" style="background: #16a34a;">담기</button>
                    </div>
                    <div id="shoppingListContainer" style="max-height: 180px; overflow-y: auto;"></div>
                </div>

                <!-- 내가 저장한 AI 레시피 -->
                <div class="fridge-panel">
                    <h3 style="margin-top: 0; margin-bottom: 12px; font-size: 1.1rem; font-weight: 700;">
                        <i class="fas fa-bookmark" style="color: #ea580c;"></i> 내가 저장한 AI 레시피
                        <span id="favCount" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">(0)</span>
                    </h3>
                    <div id="myFavoriteList" style="display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto;"></div>
                </div>

                <!-- 스크랩한 유저 레시피 -->
                <div class="fridge-panel">
                    <h3 style="margin-top: 0; margin-bottom: 12px; font-size: 1.1rem; font-weight: 700;">
                        <i class="fas fa-heart" style="color: #f43f5e;"></i> 스크랩한 유저 레시피
                        <span id="scrapCount" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">(0)</span>
                    </h3>
                    <div id="myScrapList" style="display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto;"></div>
                </div>
            </aside>

            <!-- 오른쪽 콘텐츠 -->
            <div class="recipe-content">
                <!-- AI 추천 레시피 -->
                <div id="recipeSectionContainer">
                    <div class="results-header">
                        <h2 class="results-title">추천 레시피 <span id="resultCount" class="count-number">0</span></h2>
                    </div>
                    <div class="recipe-grid" id="recipeGrid"></div>
                </div>

                <!-- 유저 커뮤니티 -->
                <div id="communitySectionContainer" class="community-container" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h2 class="results-title" style="margin: 0;">유저 레시피 공유 커뮤니티</h2>
                        <button class="btn-write-post" onclick="openCommunityWriteModal()">
                            <i class="fas fa-pen"></i> 나만의 레시피 공유하기
                        </button>
                    </div>
                    <div id="communityPostList"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 레시피 상세 모달 -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- 커뮤니티 글쓰기 모달 -->
    <div id="communityModal" class="modal">
        <div class="modal-content" style="max-width: 500px; padding: 30px;">
            <span class="close-btn" onclick="closeCommunityWriteModal()"><i class="fas fa-times"></i></span>
            <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 1.4rem; font-weight: 700;">나만의 레시피 공유</h3>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label>레시피 제목</label>
                <input type="text" id="commTitleInput" placeholder="예: 자취생 특제 5분 라볶이">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label>요리 사진 첨부</label>
                <input type="file" id="commImageInput" accept="image/*">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>레시피 내용 및 조리법</label>
                <textarea id="commContentInput" rows="5" placeholder="재료와 조리 과정을 자세히 적어주세요!"></textarea>
            </div>
            
            <button onclick="submitCommunityPost()" class="btn-primary-full">게시글 등록하기</button>
        </div>
    </div>

    <!-- 커뮤니티 수정 모달 -->
    <div id="communityEditModal" class="modal">
    <div class="modal-content" style="max-width: 500px; padding: 30px; position: relative;">
        <span class="close-btn" onclick="closeCommunityEditModal()" style="position: absolute; right: 20px; top: 20px; cursor: pointer; font-size: 1.2rem;"><i class="fas fa-times"></i></span>
        <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 1.4rem; font-weight: 700;">레시피 수정하기</h3>
        
        <input type="hidden" id="editPostId">
        
        <div class="form-group" style="margin-bottom: 15px;">
            <label>레시피 제목</label>
            <input type="text" id="editTitleInput">
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label>요리 사진 변경 (선택)</label>
            <input type="file" id="editImageInput" accept="image/*">
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 6px;">
                새 사진을 선택하지 않으면 기존 사진이 유지됩니다.
            </p>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label>레시피 내용 및 조리법</label>
            <textarea id="editContentInput" rows="5"></textarea>
        </div>
        
        <button onclick="updateCommunityPost()" class="btn-primary-full">수정 완료하기</button>
    </div>
</div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCEXaaN4-iqvyMtYGuwDSH6veisYXYJqR4",
            authDomain: "capstonedesign-45ec4.firebaseapp.com",
            projectId: "capstonedesign-45ec4",
            storageBucket: "capstonedesign-45ec4.firebasestorage.app",
            messagingSenderId: "746369744864",
            appId: "1:746369744864:web:bcbd5626d82e148559f585"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>

    <script src="script.js"></script>

    <script>
        // 탭 전환
        function switchMainTab(type) {
            const recipeSec = document.getElementById('recipeSectionContainer');
            const commSec = document.getElementById('communitySectionContainer');
            const btnRecipe = document.getElementById('tabBtnRecipe');
            const btnComm = document.getElementById('tabBtnCommunity');

            if (type === 'recipe') {
                recipeSec.style.display = 'block';
                commSec.style.display = 'none';
                btnRecipe.classList.add('active');
                btnComm.classList.remove('active');
            } else {
                recipeSec.style.display = 'none';
                commSec.style.display = 'block';
                btnComm.classList.add('active');
                btnRecipe.classList.remove('active');
                if (typeof loadCommunityPosts === 'function') loadCommunityPosts();
            }
        }

        // 커뮤니티 모달
        function openCommunityWriteModal() {
            document.getElementById('communityModal').style.display = 'flex';
        }
        function closeCommunityWriteModal() {
            document.getElementById('communityModal').style.display = 'none';
        }
        function closeCommunityEditModal() {
            document.getElementById('communityEditModal').style.display = 'none';
        }

        // 장보기 메모
        function addShoppingItem() {
            const input = document.getElementById('shopInput');
            const text = input.value.trim();
            if (!text) return;

            const container = document.getElementById('shoppingListContainer');
            const div = document.createElement('div');
            div.className = 'shopping-item';
            div.innerHTML = `
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex:1;">
                    <input type="checkbox">
                    <span>${text}</span>
                </label>
                <i class="fas fa-times" style="color:#a8a29e; cursor:pointer;" onclick="this.parentElement.remove(); updateShopCount();"></i>
            `;
            container.appendChild(div);
            input.value = '';
            updateShopCount();
        }

        function updateShopCount() {
            const container = document.getElementById('shoppingListContainer');
            const countEl = document.getElementById('shopCount');
            if (container && countEl) {
                countEl.innerText = `(${container.querySelectorAll('.shopping-item').length})`;
            }
        }

        function clearShoppingList() {
            document.getElementById('shoppingListContainer').innerHTML = '';
            updateShopCount();
        }

        // 냉장고 전체 비우기 (Firebase 연동)
        function clearAllIngredients() {
            const user = auth.currentUser;
            if (!user) {
                alert("로그인이 필요합니다.");
                return;
            }
            if (!confirm("냉장고의 모든 재료를 비우시겠습니까?")) return;

            const fridgeRef = db.collection("users").doc(user.uid).collection("fridge");
            fridgeRef.get().then((snapshot) => {
                if (snapshot.empty) {
                    alert("이미 냉장고가 비어 있습니다.");
                    return;
                }
                const batch = db.batch();
                snapshot.docs.forEach((doc) => batch.delete(doc.ref));
                return batch.commit();
            }).then(() => {
                console.log("냉장고 전체 비우기 완료");
            }).catch((err) => {
                console.error("전체 비우기 실패:", err);
                alert("재료를 비우는 중 오류가 발생했습니다.");
            });
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById("recipeModal").style.display = "none";
        }

        // 초기화
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof initTheme === 'function') initTheme();
        });
    </script>
</body>
</html>
